[package]
name = "converter-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "converter"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
converter-core = { path = "../core" }
converter-tachi = { path = "../tachi" }
converter-aidoku = { path = "../aidoku" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
